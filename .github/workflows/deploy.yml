name: Deploy Privileged Identity Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  APP_URL: https://identitymonitor.modernendpoint.tech

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Frontend ────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Embed frontend inside backend/public ──────────────────────
      - name: Copy frontend dist → backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/. backend/public/

      # ── Install backend prod deps (npm install to pick up new packages) ──
      - name: Install backend deps
        working-directory: backend
        run: npm install --omit=dev

      # ── Deploy backend folder (includes public/) ──────────────────
      # Single-attempt azure/webapps-deploy@v3 was hitting OneDeploy
      # Conflict (CODE: 409) from Kudu — same failure class confirmed on
      # EnrollmentFlowMonitor-Wa and MEGuard (same Azure subscription) in
      # 2026-08-04/09. Root cause on EnrollmentFlow: a stuck/contending Kudu
      # deployment state a single-shot deploy can't recover from, but a
      # retry with real backoff usually clears. Discovered here 2026-08-09:
      # every commit since 2026-07-15 failed to actually ship. Retrying 3x
      # instead of failing on the first conflict.
      - name: Deploy to Azure App Service (attempt 1)
        id: deploy-1
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./backend

      - name: Wait before retry 1
        if: steps.deploy-1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed — waiting 90s before retry..."
          sleep 90

      - name: Deploy to Azure App Service (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./backend

      - name: Wait before retry 2
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed — waiting 90s before retry..."
          sleep 90

      - name: Deploy to Azure App Service (attempt 3)
        id: deploy-3
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./backend

      # ── Clean up old artifacts to stay within 0.5 GB storage limit ─
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Get all artifact IDs sorted by created_at descending, skip the newest 1
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id' \
            | xargs -I{} gh api --method DELETE "repos/$REPO/actions/artifacts/{}" \
            && echo "✅ Old artifacts cleaned up" || echo "⚠️ Artifact cleanup had errors (non-fatal)"

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    timeout-minutes: 5

    steps:
      - name: Wait for app to warm up
        run: sleep 40

      - name: Health check (ok:true + version)
        run: |
          BODY=$(curl -fsS --max-time 15 "$APP_URL/api/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "❌ /api/health missing ok:true"; exit 1; }
          echo "$BODY" | grep -q '"version"'  || { echo "❌ /api/health missing version field"; exit 1; }
          echo "✅ /api/health OK"

      - name: Auth gate — alerts (must return 401)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/alerts")
          [ "$STATUS" = "401" ] || { echo "❌ /api/alerts returned $STATUS (expected 401)"; exit 1; }
          echo "✅ /api/alerts gate OK"

      - name: Auth gate — PIM status (must return 401 or 403)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/pim/status")
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || { echo "❌ /api/pim/status returned $STATUS (expected 401/403)"; exit 1; }
          echo "✅ /api/pim/status gate OK"

      - name: No 500 on unknown route
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/nonexistent_smoke_xyz")
          [ "$STATUS" = "404" ] || [ "$STATUS" = "401" ] || { echo "❌ Unknown route returned $STATUS (expected 404, possible crash)"; exit 1; }
          echo "✅ Unknown route → $STATUS (no 500)"

      - name: Remediation route mounted
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/remediation")
          [ "$STATUS" != "404" ] || { echo "❌ /api/remediation returned 404 — route not mounted"; exit 1; }
          echo "✅ /api/remediation mounted ($STATUS)"

      - name: Frontend loads
        run: |
          curl -fsS --max-time 15 "$APP_URL/" | grep -qi "<html" || { echo "❌ Frontend HTML not returned"; exit 1; }
          echo "✅ Frontend OK"

      - name: Smoke test summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All smoke tests passed — IdentityMonitor is healthy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
