name: Deploy Privileged Identity Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  APP_URL: https://identitymonitor.modernendpoint.tech

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Disable the built-in SCM/GitHub deployment source ──────────
      # Same root cause confirmed on EnrollmentFlowMonitor-Wa: when
      # scmType is GitHubAction, Azure's own Deployment Center pipeline
      # also tries to deploy on every push, races with our OneDeploy
      # call and causes Conflict (409) — every commit since 2026-07-15
      # failed here for exactly this reason (10 consecutive failures,
      # including after a Portal Stop/Start, confirming it isn't just a
      # stuck lock like it was on EnrollmentFlow — the racing source was
      # still configured and re-triggering deploys of its own).
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Disable built-in GitHubAction deployment source
        run: |
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          RG=$(az resource list --name "$APP_NAME" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          echo "Resource group: $RG"
          SCM_TYPE=$(az webapp config show --name "$APP_NAME" --resource-group "$RG" --query "scmType" -o tsv)
          echo "Current scmType: $SCM_TYPE"
          if [ "$SCM_TYPE" != "None" ]; then
            echo "Setting scmType=None to release the deployment lock..."
            az webapp deployment source delete --name "$APP_NAME" --resource-group "$RG"
          else
            echo "scmType already None — nothing to do."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── Build Frontend ────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Embed frontend inside backend/public ──────────────────────
      - name: Copy frontend dist → backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/. backend/public/

      # ── Install backend prod deps (npm install to pick up new packages) ──
      - name: Install backend deps
        working-directory: backend
        run: npm install --omit=dev

      # ── Deploy via WEBSITE_RUN_FROM_PACKAGE, bypassing Kudu/OneDeploy ──
      # azure/webapps-deploy@v3 (OneDeploy) hit Conflict (CODE: 409) on every
      # single attempt since 2026-07-15 — 12+ consecutive failures across
      # scmType fix, Portal Stop/Start, and 4-minute backoff, all the
      # standard remedies confirmed to have worked on EnrollmentFlowMonitor-Wa
      # and MEGuard. Kudu deployment history showed no stuck lock and the
      # site itself was healthy throughout, so something about this specific
      # app's OneDeploy path is broken in a way retries can't fix. Run-from-
      # package sidesteps Kudu's deploy pipeline entirely: upload the built
      # zip to blob storage, point the site at it via an app setting, Azure
      # mounts it read-only on restart. No OneDeploy call, no lock to race.
      - name: Zip backend package
        run: |
          cd backend
          zip -r "$RUNNER_TEMP/deploy.zip" . -x ".git/*" >/dev/null
          cd ..
          unzip -l "$RUNNER_TEMP/deploy.zip" | tail -5

      - name: Upload package to Blob Storage
        id: upload
        run: |
          ACCOUNT="identitymonitor"
          CONTAINER="deploy-packages"
          BLOB="backend-${{ github.sha }}.zip"

          KEY=$(az storage account keys list --account-name "$ACCOUNT" --query "[0].value" -o tsv)

          az storage container create \
            --account-name "$ACCOUNT" --account-key "$KEY" \
            --name "$CONTAINER" --public-access off >/dev/null

          az storage blob upload \
            --account-name "$ACCOUNT" --account-key "$KEY" \
            --container-name "$CONTAINER" --name "$BLOB" \
            --file "$RUNNER_TEMP/deploy.zip" --overwrite >/dev/null

          EXPIRY=$(date -u -d "+10 years" '+%Y-%m-%dT%H:%MZ')
          SAS=$(az storage blob generate-sas \
            --account-name "$ACCOUNT" --account-key "$KEY" \
            --container-name "$CONTAINER" --name "$BLOB" \
            --permissions r --expiry "$EXPIRY" -o tsv)

          BLOB_URL="https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}/${BLOB}?${SAS}"
          echo "::add-mask::$BLOB_URL"
          echo "blob_url=$BLOB_URL" >> "$GITHUB_OUTPUT"

      - name: Point WEBSITE_RUN_FROM_PACKAGE at the new package
        run: |
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          RG=$(az resource list --name "$APP_NAME" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          az webapp config appsettings set --name "$APP_NAME" --resource-group "$RG" --settings \
            WEBSITE_RUN_FROM_PACKAGE="${{ steps.upload.outputs.blob_url }}" >/dev/null
          echo "✅ WEBSITE_RUN_FROM_PACKAGE updated — app restarts and mounts the new package"

      # ── Clean up old artifacts to stay within 0.5 GB storage limit ─
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Get all artifact IDs sorted by created_at descending, skip the newest 1
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id' \
            | xargs -I{} gh api --method DELETE "repos/$REPO/actions/artifacts/{}" \
            && echo "✅ Old artifacts cleaned up" || echo "⚠️ Artifact cleanup had errors (non-fatal)"

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    timeout-minutes: 5

    steps:
      - name: Wait for app to warm up
        run: sleep 40

      - name: Health check (ok:true + version)
        run: |
          BODY=$(curl -fsS --max-time 15 "$APP_URL/api/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "❌ /api/health missing ok:true"; exit 1; }
          echo "$BODY" | grep -q '"version"'  || { echo "❌ /api/health missing version field"; exit 1; }
          echo "✅ /api/health OK"

      - name: Auth gate — alerts (must return 401)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/alerts")
          [ "$STATUS" = "401" ] || { echo "❌ /api/alerts returned $STATUS (expected 401)"; exit 1; }
          echo "✅ /api/alerts gate OK"

      - name: Auth gate — PIM analyze (must return 401 or 403)
        run: |
          # There is no /api/pim/status route — pim.js only exposes /analyze
          # (confirmed by reading backend/src/routes/pim.js). This check was
          # testing a route that never existed.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/pim/analyze")
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || { echo "❌ /api/pim/analyze returned $STATUS (expected 401/403)"; exit 1; }
          echo "✅ /api/pim/analyze gate OK"

      - name: No 500 on unknown route
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL/api/nonexistent_smoke_xyz")
          [ "$STATUS" = "404" ] || [ "$STATUS" = "401" ] || { echo "❌ Unknown route returned $STATUS (expected 404, possible crash)"; exit 1; }
          echo "✅ Unknown route → $STATUS (no 500)"

      - name: Remediation route mounted
        run: |
          # remediation.js never defines the bare '/' path, only sub-routes
          # (/health, /catalog/*, /plan, ...) — checking the bare mount point
          # 404s even when the router is correctly mounted. /health is the
          # router's own unauthenticated liveness endpoint.
          BODY=$(curl -fsS --max-time 15 "$APP_URL/api/remediation/health")
          echo "$BODY" | grep -q '"ok":true' || { echo "❌ /api/remediation/health missing ok:true"; exit 1; }
          echo "✅ /api/remediation mounted (health: $BODY)"

      - name: Frontend loads
        run: |
          curl -fsS --max-time 15 "$APP_URL/" | grep -qi "<html" || { echo "❌ Frontend HTML not returned"; exit 1; }
          echo "✅ Frontend OK"

      - name: Smoke test summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All smoke tests passed — IdentityMonitor is healthy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
