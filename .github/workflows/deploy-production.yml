name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: 'Type "yes" to confirm production deploy'
        required: true
        default: ''

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy intent
        run: |
          if [ "${{ github.event.inputs.confirmed }}" != "yes" ]; then
            echo "❌ Deploy not confirmed. Type 'yes' in the input field."
            exit 1
          fi
          echo "✅ Production deploy confirmed by ${{ github.actor }}"

  deploy-production:
    needs: guard
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Build Frontend ─────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend dist → backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/. backend/public/

      # ── Install backend deps ───────────────────────────────────────
      - name: Install backend deps
        working-directory: backend
        run: npm install --omit=dev

      # ── Final smoke test on staging before promoting ───────────────
      - name: Resolve staging URL
        id: get-staging-url
        run: |
          if [ -n "${{ secrets.AZURE_STAGING_URL }}" ]; then
            echo "url=${{ secrets.AZURE_STAGING_URL }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AZURE_STAGING_APP_NAME }}" ]; then
            echo "url=https://${{ secrets.AZURE_STAGING_APP_NAME }}.azurewebsites.net" >> $GITHUB_OUTPUT
            echo "⚠️ AZURE_STAGING_URL not set — constructed from AZURE_STAGING_APP_NAME"
          else
            echo "❌ No staging URL available — cannot run smoke tests"
            exit 1
          fi

      - name: Wait for staging to become healthy
        run: |
          URL="${{ steps.get-staging-url.outputs.url }}/api/health"
          echo "Polling: $URL"
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /tmp/curl_body -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 "$URL" 2>/tmp/curl_err) || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging is healthy"
              break
            fi
            if [ "$i" = "36" ]; then
              echo "❌ Staging did not become healthy after 3 minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Final smoke test on staging
        run: node backend/tests/smoke.js
        env:
          TEST_URL: ${{ steps.get-staging-url.outputs.url }}
          MOCK_MODE: "true"

      # ── Deploy to PRODUCTION ───────────────────────────────────────
      - name: 🚀 Deploy to Azure App Service (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./backend
          app-settings-json: |
            [
              {"name": "WEBAPP_REMEDIATION_BASE_URL", "value": "${{ secrets.WEBAPP_REMEDIATION_BASE_URL }}", "slotSetting": false},
              {"name": "WEBAPP_REMEDIATION_TOKEN", "value": "${{ secrets.WEBAPP_REMEDIATION_TOKEN }}", "slotSetting": false}
            ]

      - name: ✅ Production deploy complete
        run: |
          echo "🚀 Production is live!"
          echo "URL: https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net"

      # ── Clean up old artifacts ─────────────────────────────────────
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id' \
            | xargs -I{} gh api --method DELETE "repos/$REPO/actions/artifacts/{}" \
            && echo "✅ Old artifacts cleaned up" || echo "⚠️ Non-fatal"
